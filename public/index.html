        let secondaryApp = null;
        // Akun nasabah dibuat lewat koneksi Firebase kedua supaya sesi admin tidak ikut berganti
        function getSecondaryAuth() {
            if (!secondaryApp) secondaryApp = firebase.initializeApp(firebaseConfig, 'secondary');
            return secondaryApp.auth();
        }

        function openTambahNasabahModal() {
            openModal(`
                <form onsubmit="handleTambahNasabah(event)" class="modal-card bg-white max-w-md w-full p-5 sm:p-6 rounded-3xl shadow-2xl space-y-4">
                    ${modalHeader('Tambah Nasabah')}
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Lengkap</label>
                        <input type="text" id="new-nasabah-name" required maxlength="60" placeholder="Nama nasabah" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nomor HP / WhatsApp</label>
                        <input type="tel" inputmode="numeric" id="new-nasabah-phone" required maxlength="16" placeholder="Contoh: 081234567890" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                        <p class="text-[11px] text-slate-400 mt-1">Nomor ini dipakai nasabah untuk masuk.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Alamat (opsional)</label>
                        <input type="text" id="new-nasabah-address" maxlength="120" placeholder="Contoh: Blok C5 No. 12" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                    </div>
                    ${pinField('new-nasabah-pin', 'PIN Awal (min. 6 karakter)', 'Buat PIN untuk nasabah', 'new-password')}
                    <p class="text-[11px] text-slate-400 -mt-2">Berikan PIN ini ke nasabah. Mereka bisa menggantinya sendiri lewat menu Profil → Ganti PIN.</p>
                    <div class="flex gap-2 pt-1">
                        <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm">Batal</button>
                        <button type="submit" id="btn-tambah-nasabah" class="flex-1 py-3 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm">Tambah</button>
                    </div>
                </form>
            `);
        }

        async function handleTambahNasabah(event) {
            event.preventDefault();
            const name = document.getElementById('new-nasabah-name').value.trim();
            const phone = document.getElementById('new-nasabah-phone').value.trim();
            const address = document.getElementById('new-nasabah-address').value.trim();
            const pin = document.getElementById('new-nasabah-pin').value;
            const digits = phone.replace(/[^0-9]/g, '');

            if (!name) { showToast('Nama tidak boleh kosong!', 'error'); return; }
            if (digits.length < 8) { showToast('Nomor HP tidak valid!', 'error'); return; }
            if (pin.length < 6) { showToast('PIN minimal 6 karakter!', 'error'); return; }
            if (dbUsers.some(u => String(u.phone || '').replace(/[^0-9]/g, '') === digits)) {
                showToast('Nomor HP ini sudah terdaftar sebagai nasabah!', 'error');
                return;
            }

            const btn = document.getElementById('btn-tambah-nasabah');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            const sAuth = getSecondaryAuth();
            let cred = null;
            try {
                cred = await sAuth.createUserWithEmailAndPassword(phoneToEmail(phone), pin);
                const newUser = { phone, name, role: 'nasabah', saldo: 0, joinedDate: todayStr(), status: 'Aktif' };
                if (address) newUser.address = address;
                await db.collection('users').doc(cred.user.uid).set(newUser);
                await sAuth.signOut();
                closeModal();
                showToast('Nasabah ' + name + ' berhasil ditambahkan.');
            } catch (err) {
                console.error(err);
                // Jika akun login terlanjur dibuat tapi profil gagal tersimpan, batalkan agar tidak ada akun yatim
                if (cred && cred.user) { try { await cred.user.delete(); } catch (e) { console.error(e); } }
                try { await sAuth.signOut(); } catch (e) { /* abaikan */ }
                const msg = {
                    'auth/email-already-in-use': 'Nomor HP ini pernah terdaftar. Jika nasabahnya sudah dihapus sebelumnya, hapus dulu akun loginnya di Firebase Console → Authentication, atau pakai nomor lain.',
                    'auth/weak-password': 'PIN terlalu lemah, minimal 6 karakter!',
                    'auth/invalid-email': 'Nomor HP tidak valid!'
                }[err.code] || ('Gagal menambah nasabah: ' + err.message);
                showToast(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Tambah';
            }
        }

        function openHapusNasabahModal(userId) {
            const u = dbUsers.find(x => x.id === userId);
            if (!u) return;
            const jumlahSetoran = dbSetoran.filter(s => s.userId === userId).length;
            const row = (label, value) => `<div class="flex justify-between gap-4"><span class="text-slate-500">${label}</span><span class="font-semibold text-slate-800 text-right break-words">${value}</span></div>`;
            openModal(`
                <div class="modal-card bg-white max-w-md w-full p-5 sm:p-6 rounded-3xl shadow-2xl space-y-4">
                    <div class="flex items-start space-x-3">
                        <div class="w-11 h-11 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center shrink-0"><i class="fa-solid fa-user-minus"></i></div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">Hapus nasabah ini?</h3>
                            <p class="text-xs text-slate-500 mt-0.5">Profil, riwayat setoran, dan catatan penarikan nasabah dihapus permanen dan tidak bisa dikembalikan.</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 text-sm space-y-1.5">
                        ${row('Nama', esc(u.name || '-'))}
                        ${row('Nomor HP', esc(u.phone || '-'))}
                        ${row('Riwayat setoran', jumlahSetoran + ' data')}
                        ${row('Saldo', rpf(u.saldo))}
                    </div>
                    ${(u.saldo || 0) > 0 ? `<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Nasabah ini masih punya saldo ${rpf(u.saldo)}. Pastikan sudah dibayarkan sebelum dihapus.</p>` : ''}
                    <p class="text-[11px] text-slate-400">Nasabah tidak bisa masuk lagi setelah dihapus. Akun loginnya tetap ada di Firebase Authentication karena aplikasi web tidak bisa menghapusnya.</p>
                    <div class="flex gap-2 pt-1">
                        <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm">Batal</button>
                        <button type="button" id="btn-hapus-nasabah" onclick="handleHapusNasabah('${u.id}')" class="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm">Ya, Hapus</button>
                    </div>
                </div>
            `);
        }

        async function handleHapusNasabah(userId) {
            const u = dbUsers.find(x => x.id === userId);
            if (!u || u.role === 'admin') { closeModal(); return; }
            const btn = document.getElementById('btn-hapus-nasabah');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }
            try {
                // Setoran dihapus dulu (per 400 data), baru profilnya, supaya bisa diulang jika terputus di tengah jalan
                const ids = dbSetoran.filter(s => s.userId === userId).map(s => s.id);
                for (let i = 0; i < ids.length; i += 400) {
                    const batch = db.batch();
                    ids.slice(i, i + 400).forEach(sid => batch.delete(db.collection('setoran').doc(sid)));
                    await batch.commit();
                }
                const pIds = dbPenarikan.filter(x => x.userId === userId).map(x => x.id);
                for (let i = 0; i < pIds.length; i += 400) {
                    const pb = db.batch();
                    pIds.slice(i, i + 400).forEach(pid => pb.delete(db.collection('penarikan').doc(pid)));
                    await pb.commit();
                }
                await db.collection('users').doc(userId).delete();
                closeModal();
                showToast('Nasabah ' + (u.name || '') + ' dihapus.');
            } catch (err) {
                console.error(err);
                showToast('Gagal menghapus nasabah: ' + err.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'Ya, Hapus'; }
            }
        }

        function openDetailNasabahModal(userId) {
            const setoranList = dbSetoran.filter(s => s.userId === userId);
            const user = dbUsers.find(u => u.id === userId);
            if (!user) return;

            const container = document.getElementById('modal-container');
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="modal-card bg-white max-w-lg w-full p-5 sm:p-6 rounded-3xl shadow-2xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${esc(user.name)}</h3>
                            <p class="text-xs text-slate-500">HP: ${esc(user.phone)} • Bergabung: ${user.joinedDate || '-'}</p>
                            ${user.address ? `<p class="text-xs text-slate-500 mt-0.5">Alamat: ${esc(user.address)}</p>` : ''}
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-500 font-semibold">Total Saldo Terkumpul</p>
                            <p class="text-2xl font-black text-emerald-700">Rp ${(user.saldo || 0).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-500 font-semibold">Total Transaksi</p>
                            <p class="text-lg font-bold text-slate-800">${setoranList.length}x Setoran</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="font-bold text-slate-800 text-xs uppercase tracking-wider">Riwayat Setoran Nasabah Ini:</h4>
                        <div class="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                            ${setoranList.length === 0 ? '<p class="text-xs text-slate-400">Belum pernah setor.</p>' : setoranList.map(s => `
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between text-xs">
                                    <div>
                                        <p class="font-bold text-slate-800">${s.category} (${berat(s.actWeight || s.estWeight)})</p>
                                        <p class="text-[10px] text-slate-400">${s.date} • Status: ${s.status}</p>
                                    </div>
                                    <p class="font-bold text-emerald-700">Rp ${s.totalValue.toLocaleString('id-ID')}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="pt-2 flex items-center justify-between gap-3">
                        <button onclick="openHapusNasabahModal('${user.id}')" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-xl"><i class="fa-solid fa-trash mr-1"></i>Hapus Nasabah</button>
                        <button onclick="closeModal()" class="px-5 py-2 bg-slate-800 text-white font-bold text-xs rounded-xl">Tutup</button>
                    </div>
                </div>
            `;
        }

        function renderAdminHarga(prices) {
            return `
                <div class="bg-white rounded-3xl p-4 sm:p-6 shadow-md border border-slate-200 space-y-6">
                    <div>
                        <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                            <i class="fa-solid fa-tags text-teal-700"></i>
                            <span>Kelola Patokan Harga Sampah (per Kg)</span>
                        </h3>
                        <p class="text-slate-500 text-xs">Perubahan harga di sini otomatis tersimpan di cloud dan langsung tampil di aplikasi nasabah.</p>
                    </div>

                    <form onsubmit="handleUpdateHarga(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
                        ${Object.keys(prices).map(cat => `
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">${cat} (Rp / kg)</label>
                                <input type="number" id="price-${cat}" value="${prices[cat]}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm font-bold">
                            </div>
                        `).join('')}
                        <div class="md:col-span-2 pt-2">
                            <button type="submit" class="bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 px-6 rounded-xl shadow transition flex items-center space-x-2 text-xs">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Simpan Perubahan Harga</span>
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        async function handleUpdateHarga(event) {
            event.preventDefault();
            const updatedPrices = {};
            Object.keys(dbPrices).forEach(cat => {
                const val = parseFloat(document.getElementById(`price-${cat}`).value);
                if (!isNaN(val)) updatedPrices[cat] = val;
            });

            try {
                await db.collection('prices').doc('default').set(updatedPrices);
                showToast('Harga sampah berhasil diperbarui di cloud!');
            } catch (err) {
                showToast('Gagal update harga: ' + err.message, 'error');
            }
        }

        // Cek status login otomatis saat halaman dibuka
        auth.onAuthStateChanged(async (firebaseUser) => {
            if (firebaseUser) {
                try {
                    const userDoc = await db.collection('users').doc(firebaseUser.uid).get();
                    if (userDoc.exists) {
                        currentUser = { id: userDoc.id, ...userDoc.data() };
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                currentUser = null;
            }
            if (currentUser) startRealtimeListeners(currentUser); else stopRealtimeListeners();
            render();
        });
        // Render langsung halaman depan saat dimuat
        render();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    </script>
</body>
</html>
