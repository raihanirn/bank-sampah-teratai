        // Saldo masuk per tahun = jumlah totalValue setoran berstatus 'Selesai' berdasarkan tahun di field date
        function getSaldoPerTahun(setoranList) {
            const perTahun = {};
            setoranList.filter(s => s.status === 'Selesai').forEach(s => {
                const y = (s.date || '').slice(0, 4);
                if (!y) return;
                perTahun[y] = (perTahun[y] || 0) + (s.totalValue || 0);
            });
            return perTahun;
        }

        function getSaldoPerBulan(setoranList, year) {
            const perBulan = new Array(12).fill(0);
            setoranList.filter(s => s.status === 'Selesai' && (s.date || '').startsWith(year + '-')).forEach(s => {
                const m = parseInt(s.date.slice(5, 7), 10) - 1;
                if (m >= 0 && m < 12) perBulan[m] += (s.totalValue || 0);
            });
            return perBulan;
        }

        function destroyAdminCharts() {
            adminCharts.forEach(c => c.destroy());
            adminCharts = [];
        }

        function initAdminCharts() {
            destroyAdminCharts();
            if (typeof Chart === 'undefined') return; // CDN gagal dimuat
            const setoranList = JSON.parse(localStorage.getItem('bs_setoran'));
            const perTahun = getSaldoPerTahun(setoranList);
            const years = Object.keys(perTahun).sort();
            const rp = v => 'Rp ' + Number(v).toLocaleString('id-ID');
            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: ctx => rp(ctx.parsed.y) } }
                },
                scales: { y: { beginAtZero: true, ticks: { callback: v => rp(v) } } }
            };

            const elTahun = document.getElementById('chart-saldo-tahun');
            if (elTahun) {
                adminCharts.push(new Chart(elTahun, {
                    type: 'bar',
                    data: { labels: years, datasets: [{ data: years.map(y => perTahun[y]), backgroundColor: '#0f766e', borderRadius: 8 }] },
                    options: baseOptions
                }));
            }

            const elBulan = document.getElementById('chart-saldo-bulan');
            if (elBulan) {
                adminCharts.push(new Chart(elBulan, {
                    type: 'line',
                    data: {
                        labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
                        datasets: [{ data: getSaldoPerBulan(setoranList, adminSaldoYear), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.15)', fill: true, tension: 0.3, pointRadius: 4 }]
                    },
                    options: baseOptions
                }));
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-white font-medium text-sm flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');

        function handleAuthSubmit(event) {
            event.preventDefault();
            const phone = document.getElementById('auth-phone').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            let users = JSON.parse(localStorage.getItem('bs_users'));

            if (authMode === 'login' || selectedAuthRole === 'admin') {
                const found = users.find(u => u.phone === phone && u.pin === pin && u.role === selectedAuthRole);
                if (found) {
                    currentUser = found;
                    localStorage.setItem('bs_current_user', JSON.stringify(currentUser));
                    showToast(`Selamat datang kembali, ${currentUser.name}!`);
                    render();
                } else {
                    showToast('Nomor HP atau PIN salah / role tidak sesuai!', 'error');
                }
            } else {
                // REGISTRATION NASABAH - AUTOMATICALLY CREATED IN SYSTEM & VISIBLE TO ADMIN
                const name = document.getElementById('reg-name').value.trim();
                if (users.some(u => u.phone === phone)) {
                    showToast('Nomor HP sudah terdaftar!', 'error');
                    return;
                }
                const today = todayStr();
                const newUser = {
                    id: 'u_' + Date.now(),
                    phone,
                    pin,
                    name,
                    role: 'nasabah',
                    saldo: 0,
                    joinedDate: today,
                    status: 'Aktif'
                };
                users.push(newUser);
                localStorage.setItem('bs_users', JSON.stringify(users));
                currentUser = newUser;
                localStorage.setItem('bs_current_user', JSON.stringify(currentUser));
                showToast('Pendaftaran Berhasil! Data Anda sudah terdaftar di sistem Bank Sampah.');
                render();
            }
        }

        function renderNasabahBeranda(setoranList, prices, totalBerat) {
            const freshUser = JSON.parse(localStorage.getItem('bs_users')).find(u => u.id === currentUser.id);
            currentUser.saldo = freshUser ? freshUser.saldo : 0;

            const selesai = setoranList.filter(s => s.status === 'Selesai');
            const categorySummary = {};
            Object.keys(prices).forEach(cat => categorySummary[cat] = 0);
            selesai.forEach(s => { if (categorySummary[s.category] !== undefined) categorySummary[s.category] += s.actWeight; });

            const thisYear = String(new Date().getFullYear());
            const years = [...new Set(selesai.map(s => s.date.slice(0, 4)).concat(thisYear))].sort().reverse();
            if (!selectedYear || !years.includes(selectedYear)) selectedYear = years[0];
            const yearData = selesai.filter(s => s.date.slice(0, 4) === selectedYear);
            const yearBerat = yearData.reduce((a, s) => a + s.actWeight, 0);
            const yearRupiah = yearData.reduce((a, s) => a + s.totalValue, 0);
            const monthlyData = BULAN.map((nama, i) => {
                const key = selectedYear + '-' + String(i + 1).padStart(2, '0');
                const rows = yearData.filter(s => s.date.slice(0, 7) === key);
                return { nama, kg: rows.reduce((a, s) => a + s.actWeight, 0), rp: rows.reduce((a, s) => a + s.totalValue, 0) };
            });

            let anniversaryHtml = '';
            const joined = new Date((freshUser && freshUser.joinedDate ? freshUser.joinedDate : currentUser.joinedDate) + 'T00:00:00');
            const now = new Date();
            const monthsElapsed = (now.getFullYear() - joined.getFullYear()) * 12 + (now.getMonth() - joined.getMonth()) - (now.getDate() < joined.getDate() ? 1 : 0);
            const yearsDone = Math.floor(monthsElapsed / 12);
            if (yearsDone >= 1) {
                const startIdx = joined.getFullYear() * 12 + joined.getMonth() + (yearsDone - 1) * 12;
                const months = [];
                for (let i = 0; i < 12; i++) {
                    const idx = startIdx + i;
                    const y = Math.floor(idx / 12), m = idx % 12;
                    const key = y + '-' + String(m + 1).padStart(2, '0');
                    const rows = selesai.filter(s => s.date.slice(0, 7) === key);
                    months.push({ label: BULAN[m] + ' ' + y, kg: rows.reduce((a, s) => a + s.actWeight, 0), rp: rows.reduce((a, s) => a + s.totalValue, 0) });
                }
                const annKg = months.reduce((a, m) => a + m.kg, 0);
                const annRp = months.reduce((a, m) => a + m.rp, 0);
                const seenKey = 'bs_anniv_seen_' + currentUser.id + '_' + yearsDone;
                if (!localStorage.getItem(seenKey)) {
                    localStorage.setItem(seenKey, '1');

                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-white/80 p-3 rounded-xl border border-amber-200"><p class="text-[10px] text-amber-800 font-semibold uppercase">Total Sampah</p><p class="text-lg font-extrabold text-emerald-700">${kg(annKg)} kg</p></div>
                            <div class="bg-white/80 p-3 rounded-xl border border-amber-200"><p class="text-[10px] text-amber-800 font-semibold uppercase">Penghasilan</p><p class="text-lg font-extrabold text-emerald-700">${rpf(annRp)}</p></div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-gradient-to-br from-emerald-600 via-teal-600 to-emerald-700 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full pointer-events-none"></div>
                    <p class="text-emerald-100 text-[11px] font-semibold uppercase tracking-wider">Total Saldo Tabungan</p>
                    <h2 class="text-3xl font-black tracking-tight mt-1">${rpf(currentUser.saldo)}</h2>
                    <div class="mt-3 inline-flex items-center space-x-2 bg-white/15 px-3 py-1.5 rounded-full text-xs font-semibold">

                                <p class="text-[10px] text-emerald-200 uppercase">${cat}</p>
                                <p class="text-sm font-bold">${kg(categorySummary[cat])} kg</p>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${anniversaryHtml}

                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-base mb-3 flex items-center space-x-2"><i class="fa-solid fa-chart-column text-emerald-600"></i><span>Rekap Per Bulan</span></h3>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3">

                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100"><p class="text-[10px] text-slate-500 font-semibold uppercase">Sampah ${selectedYear}</p><p class="text-lg font-extrabold text-emerald-700">${kg(yearBerat)} kg</p></div>

                            </div>

                    </div>
                </div>
            `;
        }

                            <div>
                                <p class="text-xs text-slate-500 font-semibold uppercase">Setoran Bulan Ini</p>

                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-teal-100 text-teal-700 rounded-2xl flex items-center justify-center font-bold text-xl">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 font-semibold uppercase">Total Saldo Tahun ${adminSaldoYear}</p>
                                <h3 class="text-xl font-black text-slate-800">Rp ${saldoTahunIni.toLocaleString('id-ID')}</h3>
                                <p class="text-[10px] text-slate-400">Saldo berjalan semua nasabah: Rp ${totalSaldoAll.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center font-bold text-xl">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 font-semibold uppercase">Total Terolah</p>
                                <h3 class="text-2xl font-black text-slate-800">${kg(totalBeratAll)} kg</h3>
                            </div>
                        </div>

                    <!-- Grafik Saldo -->

                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                            <h4 class="font-bold text-slate-800 text-sm mb-3"><i class="fa-solid fa-chart-column text-teal-700 mr-2"></i>Total Saldo per Tahun</h4>
                            <div class="relative h-64"><canvas id="chart-saldo-tahun"></canvas></div>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                            <div class="flex items-center justify-between mb-3">
                                <h4 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-chart-line text-amber-500 mr-2"></i>Saldo per Bulan</h4>
                                <select onchange="adminSaldoYear = this.value; render();" class="text-xs border border-slate-200 rounded-lg px-2 py-1 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                                    ${yearOptions.map(y => `<option value="${y}" ${y === adminSaldoYear ? 'selected' : ''}>${y}</option>`).join('')}
                                </select>
                            </div>
                            <div class="relative h-64"><canvas id="chart-saldo-bulan"></canvas></div>
                        </div>
                    </div>

                    <!-- Quick Action Banner -->
                    <div class="bg-gradient-to-r from-teal-800 to-slate-800 text-white rounded-3xl p-6 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="space-y-1">
                            <h4 class="font-bold text-lg"><i class="fa-solid fa-bolt text-amber-400 mr-2"></i>Pendaftaran Nasabah Berjalan Otomatis</h4>
                            <p class="text-xs text-teal-200">Setiap nasabah yang melakukan pendaftaran mandiri dari web/HP akan langsung tercatat secara otomatis di tabel Data Nasabah tanpa perlu input manual.</p>

        function renderAdminSetoran(setoranList, prices) {
            const nasabahOptions = JSON.parse(localStorage.getItem('bs_users')).filter(u => u.role === 'nasabah');
            const rows = [...setoranList].sort((a, b) => b.date.localeCompare(a.date));
            return `
                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 mb-6">
                    <h3 class="font-bold text-slate-800 text-lg mb-1 flex items-center space-x-2">
                        <i class="fa-solid fa-circle-plus text-teal-700"></i>
                        <span>Input Setoran Sampah Nasabah</span>
                    </h3>
                    <p class="text-xs text-slate-500 mb-4">Nasabah datang langsung pada jadwal penimbangan. Catat hasil timbangan di sini, saldo nasabah otomatis bertambah sesuai harga per kategori.</p>

                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nasabah</label>

                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Kategori Sampah</label>
                            <select id="admin-setor-category" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white">
                                ${Object.keys(prices).map(cat => `<option value="${cat}">${cat} (Rp ${prices[cat].toLocaleString('id-ID')}/kg)</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Berat (kg)</label>
                            <input type="text" inputmode="decimal" autocomplete="off" id="admin-setor-weight" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm" placeholder="Contoh: 3,5 atau 0,25 (250 gram)">
                        </div>
                        <div class="flex items-end">
                            <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 px-6 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-floppy-disk"></i><span>Simpan</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                        <i class="fa-solid fa-scale-balanced text-teal-700"></i>
                        <span>Riwayat Seluruh Setoran</span>
                    </h3>
                    ${rows.length === 0 ? `
                        <div class="text-center py-12 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-2 opacity-50"></i><p>Belum ada data setoran.</p></div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-slate-600">
                                <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold">
                                    <tr>
                                        <th class="p-3.5 rounded-l-xl">Nasabah</th>
                                        <th class="p-3.5">Tanggal</th>
                                        <th class="p-3.5">Kategori</th>
                                        <th class="p-3.5">Berat</th>
                                        <th class="p-3.5 rounded-r-xl">Nilai</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${rows.map(x => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-3.5 font-bold text-slate-800">${esc(x.userName)}</td>
                                            <td class="p-3.5 text-xs text-slate-500">${x.date}</td>
                                            <td class="p-3.5 font-semibold text-slate-800">${x.category}</td>
                                            <td class="p-3.5 font-bold text-slate-800">${berat(x.actWeight)}</td>
                                            <td class="p-3.5"><span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">Rp ${x.totalValue.toLocaleString('id-ID')}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        function handleAdminInputSetoran(event) {
            event.preventDefault();
            const userId = document.getElementById('admin-setor-user').value;
            const category = document.getElementById('admin-setor-category').value;
            const actWeight = Math.round(parseFloat(String(document.getElementById('admin-setor-weight').value).trim().replace(',', '.')) * 1000) / 1000;
            const date = document.getElementById('admin-setor-date').value || todayStr();

            if (!userId || !actWeight || actWeight <= 0) {
                showToast('Lengkapi data setoran dengan benar!', 'error');
                return;
            }

            let setoranList = JSON.parse(localStorage.getItem('bs_setoran'));
            let usersList = JSON.parse(localStorage.getItem('bs_users'));
            let prices = JSON.parse(localStorage.getItem('bs_prices'));

            const userIndex = usersList.findIndex(u => u.id === userId);
            if (userIndex === -1) {
                showToast('Nasabah tidak ditemukan!', 'error');
                return;
            }

            const totalValue = Math.round(actWeight * (prices[category] || 0));

            setoranList.unshift({
                id: 's_' + Date.now(),
                userId,
                userName: usersList[userIndex].name,
                category,
                estWeight: null,
                actWeight,
                status: 'Selesai',
                date,
                totalValue
            });
            usersList[userIndex].saldo = (usersList[userIndex].saldo || 0) + totalValue;

            localStorage.setItem('bs_setoran', JSON.stringify(setoranList));
            localStorage.setItem('bs_users', JSON.stringify(usersList));

            showToast(`Setoran tersimpan! Saldo ${usersList[userIndex].name} bertambah Rp ${totalValue.toLocaleString('id-ID')}`);
            render();
        }

        function renderAdminNasabah(usersList, setoranList) {
            const filteredUsers = usersList.filter(u => 
                u.name.toLowerCase().includes(nasabahSearchQuery.toLowerCase()) || 
                u.phone.includes(nasabahSearchQuery)
            );

            return `
                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                                <i class="fa-solid fa-users text-teal-700"></i>
                                <span>Data Nasabah Terintegrasi</span>
                            </h3>
                            <p class="text-xs text-slate-500">Seluruh pendaftaran nasabah dari website/HP akan otomatis muncul di sini tanpa perlu diinput manual.</p>

                        <button onclick="openTambahNasabahModal()" class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow transition flex items-center space-x-2 self-start md:self-auto">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Tambah Nasabah Manual</span>
                        </button>
                    </div>

                    <!-- Search Input -->
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" id="search-nasabah" value="${nasabahSearchQuery}" oninput="nasabahSearchQuery = this.value; render(); const si = document.getElementById('search-nasabah'); si.focus(); si.setSelectionRange(si.value.length, si.value.length);" class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm" placeholder="Cari nama atau nomor HP nasabah...">
                    </div>

                    <!-- Nasabah Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold">
                                <tr>
                                    <th class="p-3.5 rounded-l-xl">Nama Nasabah</th>
                                    <th class="p-3.5">Nomor WhatsApp</th>
                                    <th class="p-3.5">Tgl Bergabung</th>
                                    <th class="p-3.5">Total Sampah</th>
                                    <th class="p-3.5">Total Saldo</th>
                                    <th class="p-3.5">Status</th>
                                    <th class="p-3.5 rounded-r-xl text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filteredUsers.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="p-8 text-center text-slate-400">
                                            Tidak ada data nasabah yang sesuai.
                                        </td>
                                    </tr>
                                ` : filteredUsers.map(u => {
                                    const userSetorans = setoranList.filter(s => s.userId === u.id && s.status === 'Selesai');
                                    const totalKg = userSetorans.reduce((acc, s) => acc + s.actWeight, 0);
                                    return `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-3.5">
                                                <p class="font-bold text-slate-800">${esc(u.name)}</p>
                                                <p class="text-[10px] text-teal-700 font-semibold">ID: ${u.id}</p>
                                            </td>
                                            <td class="p-3.5 font-mono text-xs text-slate-700">${u.phone}</td>
                                            <td class="p-3.5 text-xs text-slate-500">${u.joinedDate || '-'}</td>
                                            <td class="p-3.5 font-bold text-slate-800">${kg(totalKg)} kg</td>
                                            <td class="p-3.5 font-extrabold text-emerald-700">Rp ${(u.saldo || 0).toLocaleString('id-ID')}</td>

                                                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">${u.status || 'Aktif'}</span>

                                                </button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openTambahNasabahModal() {
            const container = document.getElementById('modal-container');
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-slate-800 text-base flex items-center space-x-2">
                            <i class="fa-solid fa-user-plus text-teal-700"></i>
                            <span>Tambah Nasabah Manual</span>
                        </h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <p class="text-xs text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-200">
                        <strong>Catatan:</strong> Nasabah sebenarnya bisa mendaftar mandiri via web. Gunakan form ini hanya jika nasabah minta didaftarkan langsung oleh petugas admin.
                    </p>

                    <form onsubmit="handleManualAddNasabah(event)" class="space-y-3">

                </div>

        }

        function handleManualAddNasabah(event) {
            event.preventDefault();
            const name = document.getElementById('add-nasabah-name').value.trim();
            const phone = document.getElementById('add-nasabah-phone').value.trim();
            const pin = document.getElementById('add-nasabah-pin').value.trim();

            let users = JSON.parse(localStorage.getItem('bs_users'));
            if (users.some(u => u.phone === phone)) {
                showToast('Nomor HP ini sudah terdaftar!', 'error');
                return;
            }

            const newUser = {
                id: 'u_' + Date.now(),
                phone,
                pin,
                name,
                role: 'nasabah',
                saldo: 0,
                joinedDate: todayStr(),
                status: 'Aktif'
            };

            users.push(newUser);
            localStorage.setItem('bs_users', JSON.stringify(users));
            showToast('Nasabah baru berhasil ditambahkan!');
            closeModal();
            render();
        }

        function openDetailNasabahModal(userId) {

            const container = document.getElementById('modal-container');
            container.classList.remove('hidden');
            container.innerHTML = `

                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">

                            <h3 class="font-bold text-slate-800 text-base">${user.name}</h3>

                                    <div>
                                        <p class="font-bold text-slate-800">${s.category} (${berat(s.actWeight || s.estWeight)})</p>
                                        <p class="text-[10px] text-slate-400">${s.date} • Status: ${s.status}</p>

                    <div class="pt-2 flex justify-end">
                        <button onclick="closeModal()" class="px-5 py-2 bg-slate-800 text-white font-bold text-xs rounded-xl">Tutup</button>
                    </div>
                </div>
            `;

                        <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                            <i class="fa-solid fa-tags text-teal-700"></i>
                            <span>Kelola Patokan Harga Sampah (per Kg)</span>
                        </h3>
                        <p class="text-slate-500 text-xs">Perubahan harga di sini otomatis berlaku saat admin memverifikasi timbangan nasabah.</p>
                    </div>

                    <form onsubmit="handleUpdateHarga(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
                        ${Object.keys(prices).map(cat => `
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">${cat} (Rp / kg)</label>
                                <input type="number" id="price-${cat}" value="${prices[cat]}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm font-bold">
                            </div>
                        `).join('')}
                        <div class="md:col-span-2 pt-2">
                            <button type="submit" class="bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 px-6 rounded-xl shadow transition flex items-center space-x-2 text-xs">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Simpan Perubahan Harga</span>
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function handleUpdateHarga(event) {
            event.preventDefault();
            let prices = JSON.parse(localStorage.getItem('bs_prices'));

            Object.keys(prices).forEach(cat => {
                const val = parseFloat(document.getElementById(`price-${cat}`).value);
                if (!isNaN(val)) prices[cat] = val;
            });

            localStorage.setItem('bs_prices', JSON.stringify(prices));
            showToast('Harga sampah berhasil diperbarui!');
            render();
        }

        // Initial Run
        render();
    </script>
</body>
</html>
