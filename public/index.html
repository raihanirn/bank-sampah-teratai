<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bank Sampah Teratai</title>
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#047857">
    <link rel="manifest" href="./manifest.webmanifest">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        html { -webkit-text-size-adjust: 100%; }
        body { overflow-x: hidden; }
        img { max-width: 100%; }
        .min-h-app { min-height: 100vh; min-height: 100dvh; }
        .modal-card { max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
        /* Cegah iOS zoom otomatis saat mengetuk input */
        @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-app flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        <div class="flex-1 flex items-center justify-center text-emerald-700 font-semibold text-sm">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat Bank Sampah Teratai...
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex flex-col space-y-2 w-[92%] max-w-sm pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKpU4zI2fGaBhqHTZfZkYxMHD653k2lM4",
            authDomain: "bank-sampah-teratai.firebaseapp.com",
            projectId: "bank-sampah-teratai",
            storageBucket: "bank-sampah-teratai.firebasestorage.app",
            messagingSenderId: "435357293254",
            appId: "1:435357293254:web:3fd887a1fb07be19d055c7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const LOGO = './logo.jpeg';
        const DEFAULT_PRICES = {
            'Kardus': 1800,
            'Beling': 300,
            'Besi': 4000,
            'Tutup Botol': 3000,
            'Tutup Galon': 5000,
            'Majalah': 1000,
            'Buku': 1500,
            'HVS': 1800,
            'Aluminium': 17000,
            'Aki Motor': 10000,
            'Kaleng': 2000,
            'Emberan': 2000,
            'Gelas Bersih': 4500,
            'Botol Bersih': 4000
        };

        function logoImg(cls) { return `<img src="${LOGO}" alt="Logo Bank Sampah Teratai" class="${cls} rounded-full object-cover bg-white">`; }
        function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function phoneToEmail(phone) { return `${phone.replace(/[^0-9]/g, '')}@teratai.id`; }

        // Global State (Tersinkronisasi Real-time dengan Firestore)
        let dbUsers = [];
        let dbPrices = { ...DEFAULT_PRICES };
        let dbSetoran = [];
        let dbKarya = [];
        let dbPenarikan = [];
        let dbPengumuman = [];
        let dbLog = [];
        let laporanFrom = todayStr().slice(0, 8) + '01';
        let laporanTo = todayStr();
        let listenersStarted = false;

        let currentUser = null;
        let currentView = 'welcome';
        let authMode = 'login';
        let selectedAuthRole = 'nasabah';
        let activeNasabahTab = 'beranda';
        let activeAdminTab = 'dashboard';
        let adminSaldoYear = String(new Date().getFullYear());
        let adminCharts = [];
        let nasabahSearchQuery = '';
        let selectedYear = null;
        const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

        let unsubs = [];
        let listenersKey = null;

        function stopRealtimeListeners() {
            unsubs.forEach(u => u());
            unsubs = [];
            listenersKey = null;
            dbUsers = [];
            dbSetoran = [];
            dbKarya = [];
            dbPenarikan = [];
            dbPengumuman = [];
            dbLog = [];
            dbPrices = { ...DEFAULT_PRICES };
        }

        // Admin membaca semua data; nasabah hanya membaca datanya sendiri (sesuai firestore.rules)
        function startRealtimeListeners(user) {
            if (!user) return;
            const key = user.id + ':' + user.role;
            if (listenersKey === key) return;
            stopRealtimeListeners();
            listenersKey = key;
            const isAdmin = user.role === 'admin';
            const onErr = name => err => console.error('Firestore ' + name + ' error:', err);

            unsubs.push(db.collection('prices').doc('default').onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    // Jika baru ada sebagian field, lengkapi otomatis dengan kategori lain (hanya admin yang boleh menulis)
                    if (Object.keys(data).length < Object.keys(DEFAULT_PRICES).length) {
                        const merged = { ...DEFAULT_PRICES, ...data };
                        if (isAdmin) db.collection('prices').doc('default').set(merged).catch(onErr('prices-set'));
                        dbPrices = merged;
                    } else {
                        dbPrices = data;
                    }
                    render();
                } else if (isAdmin) {
                    db.collection('prices').doc('default').set(DEFAULT_PRICES).catch(onErr('prices-set'));
                }
            }, onErr('prices')));

            const onUsers = docs => {
                dbUsers = docs;
                if (currentUser) {
                    const fresh = dbUsers.find(u => u.id === currentUser.id);
                    if (fresh) currentUser = fresh;
                }
                render();
            };
            if (isAdmin) {
                unsubs.push(db.collection('users').onSnapshot(
                    snap => onUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))), onErr('users')));
                unsubs.push(db.collection('setoran').onSnapshot(snapshot => {
                    dbSetoran = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                }, onErr('setoran')));
            } else {
                unsubs.push(db.collection('users').doc(user.id).onSnapshot(
                    doc => {
                        if (doc.exists && doc.data().status === 'Nonaktif' && currentUser && currentUser.id === user.id) {
                            showToast('Akun Anda dinonaktifkan. Hubungi pengelola.', 'error');
                            logout();
                            return;
                        }
                        if (!doc.exists && !doc.metadata.fromCache && currentUser && currentUser.id === user.id) {
                            showToast('Akun Anda sudah dihapus oleh pengelola.', 'error');
                            logout();
                            return;
                        }
                        onUsers(doc.exists ? [{ id: doc.id, ...doc.data() }] : []);
                    }, onErr('users')));
                unsubs.push(db.collection('setoran').where('userId', '==', user.id).onSnapshot(snapshot => {
                    dbSetoran = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                }, onErr('setoran')));
            }

            // Catatan penarikan: admin melihat semua, nasabah hanya miliknya sendiri
            const penarikanRef = isAdmin ? db.collection('penarikan') : db.collection('penarikan').where('userId', '==', user.id);
            unsubs.push(penarikanRef.onSnapshot(snapshot => {
                dbPenarikan = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, onErr('penarikan')));

            unsubs.push(db.collection('pengumuman').onSnapshot(snap => {
                dbPengumuman = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, onErr('pengumuman')));
            if (isAdmin) {
                unsubs.push(db.collection('log').orderBy('createdAt', 'desc').limit(100).onSnapshot(snap => {
                    dbLog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }, onErr('log')));
            }

            unsubs.push(db.collection('karya').onSnapshot(snapshot => {
                dbKarya = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, onErr('karya')));
        }

        function getSaldoPerTahun(setoranList) {
            const perTahun = {};
            setoranList.filter(s => s.status === 'Selesai').forEach(s => {
                const y = (s.date || '').slice(0, 4);
                if (!y) return;
                perTahun[y] = (perTahun[y] || 0) + (s.totalValue || 0);
            });
            return perTahun;
        }

        function getSaldoPerBulan(setoranList, year) {
            const perBulan = new Array(12).fill(0);
            setoranList.filter(s => s.status === 'Selesai' && (s.date || '').startsWith(year + '-')).forEach(s => {
                const m = parseInt(s.date.slice(5, 7), 10) - 1;
                if (m >= 0 && m < 12) perBulan[m] += (s.totalValue || 0);
            });
            return perBulan;
        }

        function destroyAdminCharts() {
            adminCharts.forEach(c => c.destroy());
            adminCharts = [];
        }

        function initAdminCharts() {
            destroyAdminCharts();
            if (typeof Chart === 'undefined') return;
            const perTahun = getSaldoPerTahun(dbSetoran);
            const years = Object.keys(perTahun).sort();
            const rp = v => 'Rp ' + Number(v).toLocaleString('id-ID');
            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: ctx => rp(ctx.parsed.y) } }
                },
                scales: { y: { beginAtZero: true, ticks: { callback: v => rp(v) } } }
            };

            const elTahun = document.getElementById('chart-saldo-tahun');
            if (elTahun) {
                adminCharts.push(new Chart(elTahun, {
                    type: 'bar',
                    data: { labels: years, datasets: [{ data: years.map(y => perTahun[y]), backgroundColor: '#0f766e', borderRadius: 8 }] },
                    options: baseOptions
                }));
            }

            const elBulan = document.getElementById('chart-saldo-bulan');
            if (elBulan) {
                adminCharts.push(new Chart(elBulan, {
                    type: 'line',
                    data: {
                        labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
                        datasets: [{ data: getSaldoPerBulan(dbSetoran, adminSaldoYear), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.15)', fill: true, tension: 0.3, pointRadius: 4 }]
                    },
                    options: baseOptions
                }));
            }
        }

        function showToast(message, type = 'success') {
            // Log aktivitas: setiap aksi admin yang berhasil dicatat (tidak bisa diubah/dihapus)
            if (type === 'success' && currentUser && currentUser.role === 'admin' && !/^(Selamat datang|Berhasil keluar)/.test(message)) {
                db.collection('log').add({ adminId: currentUser.id, adminName: currentUser.name || 'Admin', message: String(message).slice(0, 200), createdAt: Date.now() }).catch(() => {});
            }
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-white font-medium text-sm flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        document.getElementById('modal-container').addEventListener('click', e => {
            if (e.target.id === 'modal-container') closeModal();
        });

        function render() {
            const app = document.getElementById('app');
            destroyAdminCharts();
            app.innerHTML = '';

            if (!currentUser) {
                if (currentView === 'welcome') {
                    app.innerHTML = renderWelcomeScreen();
                } else if (currentView === 'auth') {
                    app.innerHTML = renderAuthScreen();
                }
            } else {
                if (currentUser.role === 'nasabah') {
                    app.innerHTML = renderNasabahPortal();
                } else if (currentUser.role === 'admin') {
                    app.innerHTML = renderAdminPortal();
                    if (activeAdminTab === 'dashboard') initAdminCharts();
                }
            }
        }

        function renderWelcomeScreen() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-emerald-800 via-emerald-600 to-teal-800 text-white relative overflow-hidden">
                    <div class="absolute -top-24 -left-24 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-emerald-400/20 rounded-full blur-3xl pointer-events-none"></div>
                    
                    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/20 text-center relative z-10">
                        <div class="mx-auto mb-6 w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-white p-1 shadow-xl">${logoImg('w-full h-full')}</div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold mb-1 tracking-tight">Bank Sampah Teratai</h1>
                        <p class="text-emerald-200 text-xs font-semibold mb-4">RW 04 Pondok Pucung Indah 1, Tangerang Selatan</p>
                        <p class="text-emerald-100 mb-8 text-sm leading-relaxed">Kelola dan pilah sampah rumah tangga Anda. Dapatkan imbalan tabungan langsung sembari menjaga lingkungan kita.</p>
                        
                        <div class="space-y-3">
                            <button onclick="goToAuth('nasabah')" class="w-full bg-white text-emerald-800 hover:bg-emerald-50 font-bold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-center space-x-2">
                                
                                <span>Portal Nasabah</span>
                            </button>
                            <button onclick="goToAuth('admin')" class="w-full bg-emerald-900/60 hover:bg-emerald-900 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg border border-emerald-400/30 transition flex items-center justify-center space-x-2">
                                
                                <span>Portal Admin</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function goToAuth(role) {
            selectedAuthRole = role;
            currentView = 'auth';
            render();
        }

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-100">
                    <div class="max-w-md w-full bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200">
                        <button onclick="currentView='welcome'; render();" class="text-emerald-600 hover:text-emerald-800 flex items-center space-x-2 mb-6 text-sm font-semibold">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali ke Halaman Depan</span>
                        </button>

                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-800">${selectedAuthRole === 'admin' ? 'Login Admin' : (authMode === 'login' ? 'Masuk Nasabah' : 'Pendaftaran Nasabah')}</h2>
                                <p class="text-xs text-slate-500 mt-0.5">${selectedAuthRole === 'admin' ? 'Masuk ke panel pengelola' : (authMode === 'login' ? 'Silakan masuk ke akun Anda' : 'Buat akun baru untuk mulai menabung')}</p>
                            </div>
                            <div class="flex flex-col items-end space-y-2 shrink-0">${logoImg('w-14 h-14')}<span class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full uppercase">${selectedAuthRole}</span></div>
                        </div>

                        ${selectedAuthRole === 'nasabah' ? `
                            <div class="flex bg-slate-100 p-1 rounded-2xl mb-6">
                                <button onclick="authMode='login'; render();" class="flex-1 py-2 text-sm font-semibold rounded-xl transition ${authMode === 'login' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">Masuk</button>
                                <button onclick="authMode='register'; render();" class="flex-1 py-2 text-sm font-semibold rounded-xl transition ${authMode === 'register' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">Daftar Akun Baru</button>
                            </div>
                        ` : ''}

                        <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            ${authMode === 'register' && selectedAuthRole === 'nasabah' ? `
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Lengkap</label>
                                    <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Contoh: Rina Wijaya">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nomor HP${authMode === 'login' ? ' atau Email' : ''}</label>
                                <input type="text" id="auth-phone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Contoh: 08123456789">
                            </div>
                            ${authMode === 'register' && selectedAuthRole === 'nasabah' ? `
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email (opsional)</label>
                                    <input type="email" id="reg-email" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Untuk reset PIN jika lupa">
                                </div>` : ''}
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">PIN / Kata Sandi (Min. 6 karakter)</label>
                                <input type="password" id="auth-pin" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Masukkan PIN minimal 6 karakter">
                            </div>
                            ${authMode === 'login' ? '<button type="button" onclick="openLupaPinModal()" class="text-xs font-semibold text-emerald-700 hover:underline -mt-1">Lupa PIN?</button>' : ''}
                            <button type="submit" id="btn-auth-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 mt-2">
                                <span>${selectedAuthRole === 'admin' ? 'Masuk Dashboard Admin' : (authMode === 'login' ? 'Masuk Sekarang' : 'Daftar & Otomatis Terhubung')}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const phone = document.getElementById('auth-phone').value.trim();
            const pin = document.getElementById('auth-pin').value.trim();
            const isMail = phone.includes('@');
            const email = isMail ? phone.toLowerCase() : phoneToEmail(phone);
            const btn = document.getElementById('btn-auth-submit');

            if (pin.length < 6) {
                showToast('PIN / Kata sandi minimal 6 karakter!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';

            try {
                if (authMode === 'login' || selectedAuthRole === 'admin') {
                    const cred = await auth.signInWithEmailAndPassword(email, pin);
                    const userDoc = await db.collection('users').doc(cred.user.uid).get();
                    if (userDoc.exists && userDoc.data().status === 'Nonaktif' && userDoc.data().role !== 'admin') {
                        await auth.signOut();
                        showToast('Akun dinonaktifkan. Hubungi pengelola.', 'error');
                    } else if (userDoc.exists && userDoc.data().role === selectedAuthRole) {
                        currentUser = { id: userDoc.id, ...userDoc.data() };
                        startRealtimeListeners(currentUser);
                        showToast(`Selamat datang kembali, ${currentUser.name}!`);
                        render();
                    } else {
                        await auth.signOut();
                        showToast('Role akun tidak sesuai atau profil tidak ditemukan!', 'error');
                    }
                } else {
                    const name = document.getElementById('reg-name').value.trim();
                    if (isMail) { showToast('Isi nomor HP, bukan email. Email diisi di kolom Email.', 'error'); return; }
                    const regMail = ((document.getElementById('reg-email') || {}).value || '').trim().toLowerCase();
                    const cred = await auth.createUserWithEmailAndPassword(regMail || email, pin);
                    const newUser = {
                        phone,
                        name,
                        role: 'nasabah',
                        saldo: 0,
                        joinedDate: todayStr(),
                        status: 'Aktif'
                    };
                    if (regMail) newUser.email = regMail;
                    await db.collection('users').doc(cred.user.uid).set(newUser);
                    currentUser = { id: cred.user.uid, ...newUser };
                    startRealtimeListeners(currentUser);
                    showToast('Pendaftaran Berhasil! Data Anda sudah terdaftar di cloud.');
                    render();
                }
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    showToast('Nomor HP sudah terdaftar!', 'error');
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    showToast('Nomor HP atau PIN salah!', 'error');
                } else {
                    showToast('Gagal: ' + error.message, 'error');
                }
            } finally {
                if (document.getElementById('btn-auth-submit')) {
                    btn.disabled = false;
                    render();
                }
            }
        }

        async function logout() {
            stopRealtimeListeners();
            await auth.signOut();
            currentUser = null;
            currentView = 'welcome';
            closeModal(); activeNasabahTab = 'beranda'; showToast('Berhasil keluar akun.');
            render();
        }

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function kg(n) { return (Math.round((n || 0) * 1000) / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 }); }

        function renderNasabahPortal() {

                                <nav class="hidden lg:flex items-center gap-1">
                                    ${tabs.map(t => `

                    <nav class="fixed bottom-0 inset-x-0 z-40 lg:hidden">

                            ${tabs.map(t => `
                                <button onclick="activeNasabahTab='${t[0]}'; render(); window.scrollTo(0,0);" class="relative flex flex-col items-center justify-center py-2.5 text-[11px] font-semibold ${activeNasabahTab === t[0] ? 'text-emerald-700' : 'text-slate-400'}">
                                    ${activeNasabahTab === t[0] ? '<span class="absolute top-0 w-8 h-1 bg-emerald-600 rounded-b-full"></span>' : ''}
                                    <i class="fa-solid ${t[1]} text-lg mb-1"></i><span>${t[2]}</span>
                                </button>
                            `).join('')}

                    </nav>
                </div>
            `;
        }

        function renderNasabahBeranda(setoranList, prices, totalBerat) {
            const freshUser = dbUsers.find(u => u.id === currentUser.id);
            if (freshUser) currentUser.saldo = freshUser.saldo || 0;

            const selesai = setoranList.filter(s => s.status === 'Selesai');
            const categorySummary = {};
            Object.keys(prices).forEach(cat => categorySummary[cat] = 0);
            selesai.forEach(s => { if (categorySummary[s.category] !== undefined) categorySummary[s.category] += s.actWeight; });

            const thisYear = String(new Date().getFullYear());
            const years = [...new Set(selesai.map(s => s.date.slice(0, 4)).concat(thisYear))].sort().reverse();
            if (!selectedYear || !years.includes(selectedYear)) selectedYear = years[0];
            const yearData = selesai.filter(s => s.date.slice(0, 4) === selectedYear);
            const yearBerat = yearData.reduce((a, s) => a + s.actWeight, 0);
            const yearRupiah = yearData.reduce((a, s) => a + s.totalValue, 0);
            const monthlyData = BULAN.map((nama, i) => {
                const key = selectedYear + '-' + String(i + 1).padStart(2, '0');
                const rows = yearData.filter(s => s.date.slice(0, 7) === key);
                return { nama, kg: rows.reduce((a, s) => a + s.actWeight, 0), rp: rows.reduce((a, s) => a + s.totalValue, 0) };
            });

            let anniversaryHtml = '';
            const joinedStr = (freshUser && freshUser.joinedDate ? freshUser.joinedDate : currentUser.joinedDate) || todayStr();
            const joined = new Date(joinedStr + 'T00:00:00');
            const now = new Date();
            const monthsElapsed = (now.getFullYear() - joined.getFullYear()) * 12 + (now.getMonth() - joined.getMonth()) - (now.getDate() < joined.getDate() ? 1 : 0);
            const yearsDone = Math.floor(monthsElapsed / 12);
            if (yearsDone >= 1) {
                const startIdx = joined.getFullYear() * 12 + joined.getMonth() + (yearsDone - 1) * 12;
                const months = [];
                for (let i = 0; i < 12; i++) {
                    const idx = startIdx + i;
                    const y = Math.floor(idx / 12), m = idx % 12;
                    const key = y + '-' + String(m + 1).padStart(2, '0');
                    const rows = selesai.filter(s => s.date.slice(0, 7) === key);
                    months.push({ label: BULAN[m] + ' ' + y, kg: rows.reduce((a, s) => a + s.actWeight, 0), rp: rows.reduce((a, s) => a + s.totalValue, 0) });

                const annKg = months.reduce((a, m) => a + m.kg, 0);
                const annRp = months.reduce((a, m) => a + m.rp, 0);
                const seenKey = 'bs_anniv_seen_' + currentUser.id + '_' + yearsDone;
                if (!localStorage.getItem(seenKey)) {

                anniversaryHtml = `
                    <div class="bg-gradient-to-r from-amber-100 via-yellow-50 to-amber-100 rounded-3xl p-4 border border-amber-300">

                            <div>

                                <p class="text-[11px] text-amber-800 mt-0.5">${months[0].label} sampai ${months[11].label}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-white/80 p-3 rounded-xl border border-amber-200"><p class="text-[10px] text-amber-800 font-semibold uppercase">Total Sampah</p><p class="text-lg font-extrabold text-emerald-700">${kg(annKg)} kg</p></div>
                            <div class="bg-white/80 p-3 rounded-xl border border-amber-200"><p class="text-[10px] text-amber-800 font-semibold uppercase">Penghasilan</p><p class="text-lg font-extrabold text-emerald-700">${rpf(annRp)}</p></div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-12 lg:gap-6 lg:items-start">
                <div class="space-y-4 lg:col-span-5 xl:col-span-4 lg:sticky lg:top-24">
                ${pengumumanHtml()}
                <div class="bg-gradient-to-br from-emerald-600 via-teal-600 to-emerald-700 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full pointer-events-none"></div>
                    <p class="text-emerald-100 text-[11px] font-semibold uppercase tracking-wider">Total Saldo Tabungan</p>
                    <h2 class="text-3xl font-black tracking-tight mt-1">${rpf(currentUser.saldo)}</h2>
                    ${(() => { const last = [...dbPenarikan].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0))[0]; return last ? `<p class="text-[11px] text-emerald-100 mt-1">Penarikan terakhir: ${esc(formatTanggal(last.date))} &bull; ${rpf(last.amount)}</p>` : ''; })()}

                        <i class="fa-solid fa-weight-hanging"></i><span>${kg(totalBerat)} kg sampah terkumpul</span>
                    </div>
                    <div class="mt-4 -mx-1 flex gap-2 overflow-x-auto no-scrollbar px-1 lg:flex-wrap lg:overflow-visible">
                        ${Object.keys(categorySummary).map(cat => `
                            <div class="shrink-0 bg-black/10 px-3 py-2 rounded-xl border border-white/10 text-center min-w-[84px]">
                                <p class="text-[10px] text-emerald-200 uppercase">${cat}</p>
                                <p class="text-sm font-bold">${kg(categorySummary[cat])} kg</p>

                    </div>
                </div>

                ${anniversaryHtml}

                </div>
                <div class="space-y-4 lg:col-span-7 xl:col-span-8">

                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-base mb-3 flex items-center space-x-2"><i class="fa-solid fa-chart-column text-emerald-600"></i><span>Rekap Per Bulan</span></h3>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3">
                        ${years.map(y => `<button onclick="selectedYear='${y}'; render();" class="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold border ${y === selectedYear ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-200'}">${y}</button>`).join('')}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100"><p class="text-[10px] text-slate-500 font-semibold uppercase">Sampah ${selectedYear}</p><p class="text-lg font-extrabold text-emerald-700">${kg(yearBerat)} kg</p></div>
                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100"><p class="text-[10px] text-slate-500 font-semibold uppercase">Penghasilan ${selectedYear}</p><p class="text-lg font-extrabold text-emerald-700">${rpf(yearRupiah)}</p></div>
                    </div>
                    <div class="lg:grid lg:grid-cols-2 lg:gap-x-8">
                        ${monthlyData.map(m => `
                            <div class="flex items-center justify-between py-2.5 border-b border-slate-100 ${m.kg === 0 ? 'opacity-40' : ''}">
                                <span class="text-sm font-semibold text-slate-800">${m.nama}</span>
                                <span class="text-right"><span class="block text-xs text-slate-500">${kg(m.kg)} kg</span><span class="block text-sm font-bold text-emerald-700">${rpf(m.rp)}</span></span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-base mb-3 flex items-center space-x-2"><i class="fa-solid fa-tags text-emerald-600"></i><span>Patokan Harga Sampah</span></h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                        ${Object.keys(prices).map(cat => `
                            <div class="bg-emerald-50/60 p-3 rounded-2xl border border-emerald-100">
                                <p class="text-[11px] text-slate-500 font-semibold">${cat}</p>
                                <p class="text-emerald-700 font-extrabold text-sm">${rpf(prices[cat])} <span class="text-[10px] font-normal text-slate-400">/ kg</span></p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                </div>
            </div>
            `;
        }

        function renderNasabahPilah(prices) {
            const panduan = [
                { title: 'Kardus, Majalah, Buku & HVS', icon: 'fa-box-archive', desc: 'Buka lipatan kardus hingga rata, jaga semua kertas tetap kering, dan lepaskan isolasi atau plastik yang menempel.' },
                { title: 'Botol & Gelas Bersih', icon: 'fa-bottle-water', desc: 'Kosongkan sisa isi dan bilas hingga bersih. Lepaskan tutupnya dan pisahkan, karena harganya berbeda.' },

                            <div>
                                <h4 class="font-bold text-slate-800 text-sm mb-0.5">${p.title}</h4>
                                <p class="text-slate-600 text-xs leading-relaxed">${p.desc}</p>

        function renderNasabahRiwayat(setoranList) {
            const sorted = [
                ...setoranList.map(x => ({ ...x, _t: 'setoran' })),
                ...dbPenarikan.map(x => ({ ...x, _t: 'penarikan' }))
            ].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
            return `
                <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2"><i class="fa-solid fa-clock-rotate-left text-emerald-600"></i><span>Riwayat Setoran &amp; Penarikan</span></h3>
                ${dbPenarikan.length > 0 ? '<p class="text-[11px] text-slate-500 -mt-2">Penarikan saldo dicatat oleh pengelola saat uang diambil. Web ini hanya menampilkan informasi dan tidak memproses uang.</p>' : ''}
                ${sorted.length === 0 ? `

                                <div class="bg-white p-4 rounded-2xl border border-rose-100 shadow-sm">

                                        <div class="flex items-center space-x-3 min-w-0">
                                            <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-money-bill-transfer"></i></div>
                                            <div class="min-w-0">
                                                <p class="font-bold text-slate-800 text-sm truncate">Penarikan Saldo</p>
                                                <p class="text-[11px] text-slate-400">${esc(s.date || '-')}</p>
                                            </div>
                                        </div>
                                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold shrink-0 bg-rose-100 text-rose-600">Ditarik</span>
                                    </div>
                                    <div class="mt-3 pt-3 border-t border-slate-100 flex items-end justify-between gap-3">
                                        <p class="text-xs text-slate-500 min-w-0 break-words">${s.note ? esc(s.note) : 'Saldo diambil melalui pengelola'}</p>
                                        <p class="text-rose-600 font-extrabold text-base shrink-0">- ${rpf(s.amount)}</p>
                                    </div>
                                </div>`;
                            }
                            const done = s.status === 'Selesai';
                            return `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex items-center space-x-3 min-w-0">
                                        <div class="w-10 h-10 ${done ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid ${done ? 'fa-circle-check' : 'fa-hourglass-half'}"></i></div>
                                        <div class="min-w-0">
                                            <p class="font-bold text-slate-800 text-sm truncate">${s.category}</p>

                    <p class="text-slate-500 text-xs mt-1">Inspirasi produk bernilai jual dari sampah terpilah.</p>

                            </div>
                        </div>
                    `).join('')}

        function formatTanggal(str) {
            if (!str) return '-';
            const p = String(str).split('-');
            if (p.length !== 3 || !BULAN[parseInt(p[1], 10) - 1]) return str;
            return parseInt(p[2], 10) + ' ' + BULAN[parseInt(p[1], 10) - 1] + ' ' + p[0];
        }

        function initials(name) {
            const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
            const first = (parts[0] || '?')[0];
            const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
            return (first + last).toUpperCase();
        }

        function openModal(html) {
            const c = document.getElementById('modal-container');
            c.classList.remove('hidden');
            c.innerHTML = html;
        }

                <span class="text-sm font-semibold text-slate-800 text-right break-words min-w-0">${value}</span>
            </div>`;
        }

            return `<button onclick="${onclick}" class="w-full flex items-center justify-between py-3.5 text-left">

        function renderNasabahProfil(setoranList, totalBerat) {
            const u = currentUser;

        async function handleEditProfil(event) {
            event.preventDefault();
            const name = document.getElementById('prof-name').value.trim();
            const address = document.getElementById('prof-address').value.trim();
            if (!name) { showToast('Nama tidak boleh kosong!', 'error'); return; }

            const btn = document.getElementById('btn-prof-save');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const nameChanged = name !== currentUser.name;
                await db.collection('users').doc(currentUser.id).update({ name, address });

                // Samakan nama di riwayat setoran supaya admin melihat nama terbaru
                if (nameChanged) {
                    try {
                        const snap = await db.collection('setoran').where('userId', '==', currentUser.id).get();
                        const batch = db.batch();
                        snap.forEach(d => batch.update(d.ref, { userName: name }));
                        await batch.commit();
                    } catch (e) { console.error('Sinkron nama setoran gagal:', e); }
                }

                currentUser.name = name;
                currentUser.address = address;
                closeModal();
                showToast('Profil berhasil diperbarui!');
                render();
            } catch (err) {
                console.error(err);
                showToast('Gagal menyimpan profil: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Simpan';
            }
        }

        async function handleGantiPin(event) {
            event.preventDefault();
            const oldPin = document.getElementById('pin-old').value;
            const newPin = document.getElementById('pin-new').value;
            const confirmPin = document.getElementById('pin-confirm').value;

            if (newPin.length < 6) { showToast('PIN baru minimal 6 karakter!', 'error'); return; }
            if (newPin !== confirmPin) { showToast('Ulangi PIN baru belum sama!', 'error'); return; }
            if (newPin === oldPin) { showToast('PIN baru harus berbeda dari PIN lama!', 'error'); return; }

            const fbUser = auth.currentUser;
            if (!fbUser) { showToast('Sesi berakhir. Silakan masuk lagi.', 'error'); return; }

            const btn = document.getElementById('btn-pin-save');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const cred = firebase.auth.EmailAuthProvider.credential(fbUser.email, oldPin);
                await fbUser.reauthenticateWithCredential(cred);
                await fbUser.updatePassword(newPin);
                closeModal();
                showToast('PIN berhasil diganti. Pakai PIN baru saat masuk berikutnya.');
            } catch (err) {
                console.error(err);
                const msg = {
                    'auth/wrong-password': 'PIN lama salah!',
                    'auth/invalid-credential': 'PIN lama salah!',
                    'auth/weak-password': 'PIN baru terlalu lemah, minimal 6 karakter!',
                    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.',
                    'auth/requires-recent-login': 'Sesi sudah lama. Keluar lalu masuk lagi, kemudian coba ganti PIN.'
                }[err.code] || ('Gagal ganti PIN: ' + err.message);
                showToast(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Ganti PIN';
            }
        }

        async function handleAdminInputSetoran(event) {
            event.preventDefault();
            const userId = document.getElementById('admin-setor-user').value;
            const category = document.getElementById('admin-setor-category').value;
            const actWeight = Math.round(parseFloat(String(document.getElementById('admin-setor-weight').value).trim().replace(',', '.')) * 1000) / 1000;
            const date = document.getElementById('admin-setor-date').value || todayStr();

            if (!userId || !actWeight || actWeight <= 0) {
                showToast('Lengkapi data setoran dengan benar!', 'error');
                return;
            }

            const targetUser = dbUsers.find(u => u.id === userId);
            if (!targetUser) {
                showToast('Nasabah tidak ditemukan!', 'error');
                return;
            }

            const totalValue = Math.round(actWeight * (dbPrices[category] || 0));

            try {
                await db.collection('setoran').add({
                    userId,
                    userName: targetUser.name,
                    category,
                    estWeight: null,
                    actWeight,
                    status: 'Selesai',
                    date,
                    totalValue,
                    pricePerKg: dbPrices[category] || 0
                });
                await db.collection('users').doc(userId).update({
                    saldo: firebase.firestore.FieldValue.increment(totalValue)
                });

                document.getElementById('admin-setor-weight').value = '';
                showToast(`Setoran tersimpan! Saldo ${targetUser.name} bertambah Rp ${totalValue.toLocaleString('id-ID')}`);
            } catch (err) {
                console.error(err);
                showToast('Gagal menyimpan setoran: ' + err.message, 'error');
            }
        }

        function setoranUnitPrice(x) {
            // Harga per kg saat setoran dicatat; data lama dihitung mundur dari nilai tersimpan
            if (x.pricePerKg) return x.pricePerKg;
            const cur = dbPrices[x.category];
            if (cur && Math.round((x.actWeight || 0) * cur) === x.totalValue) return cur;
            return x.actWeight ? x.totalValue / x.actWeight : (cur || 0);
        }

        function parseBerat(v) {
            return Math.round(parseFloat(String(v).trim().replace(',', '.')) * 1000) / 1000;
        }

        function calcEditSetoran(x) {
            const cat = document.getElementById('edit-setor-category').value;
            const w = parseBerat(document.getElementById('edit-setor-weight').value);
            const unit = cat === x.category ? setoranUnitPrice(x) : (dbPrices[cat] || 0);
            const total = w > 0 ? Math.round(w * unit) : 0;
            return { cat, w, unit, total };
        }

        function updateEditPreview(id) {
            const x = dbSetoran.find(r => r.id === id);
            const el = document.getElementById('edit-preview');
            if (!x || !el) return;
            const r = calcEditSetoran(x);
            if (!(r.w > 0)) { el.innerHTML = '<span class="text-rose-600">Masukkan berat yang valid.</span>'; return; }
            const diff = x.status === 'Selesai' ? r.total - (x.totalValue || 0) : 0;
            const saldoTxt = diff === 0 ? 'Saldo nasabah tidak berubah.'
                : 'Saldo nasabah ' + (diff > 0 ? 'bertambah' : 'berkurang') + ' Rp ' + Math.abs(diff).toLocaleString('id-ID') + '.';
            el.innerHTML = 'Nilai baru <b class="text-emerald-700">Rp ' + r.total.toLocaleString('id-ID') + '</b> (Rp ' + Math.round(r.unit).toLocaleString('id-ID') + '/kg). ' + saldoTxt;
        }

            const x = dbSetoran.find(r => r.id === id);
            if (!x) { showToast('Data setoran tidak ditemukan!', 'error'); return; }
            const cats = Object.keys(dbPrices);
            if (!cats.includes(x.category)) cats.unshift(x.category);
            openModal(`

                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tanggal Timbang</label>
                        <input type="date" id="edit-setor-date" required value="${esc(x.date || todayStr())}" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white">

                            ${cats.map(c => `<option value="${esc(c)}" ${c === x.category ? 'selected' : ''}>${esc(c)}${dbPrices[c] ? ' (Rp ' + dbPrices[c].toLocaleString('id-ID') + '/kg)' : ''}</option>`).join('')}

                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Berat (kg)</label>

                    </div>
                    <p id="edit-preview" class="text-xs text-slate-600 bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2.5"></p>
                    <p class="text-[11px] text-slate-400">Harga per kg mengikuti harga saat setoran dicatat. Jika kategori diganti, dipakai harga sekarang. Untuk salah nasabah, hapus lalu input ulang.</p>
                    <div class="flex gap-2 pt-1">
                        <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm">Batal</button>
                        <button type="submit" id="btn-edit-setoran" class="flex-1 py-3 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm">Simpan Perubahan</button>
                    </div>
                </form>
            `);
            updateEditPreview(id);
        }

        async function handleEditSetoran(event, id) {
            event.preventDefault();
            const x = dbSetoran.find(r => r.id === id);
            if (!x) { closeModal(); return; }
            const date = document.getElementById('edit-setor-date').value || x.date;
            const r = calcEditSetoran(x);
            if (!(r.w > 0)) { showToast('Berat harus lebih dari 0!', 'error'); return; }
            const owner = dbUsers.find(u => u.id === x.userId);
            if (x.status === 'Selesai' && owner && (owner.saldo || 0) + (r.total - (x.totalValue || 0)) < 0) {
                showToast('Perubahan ini membuat saldo nasabah minus. Cek dulu catatan penarikannya.', 'error');
                return;
            }

            const btn = document.getElementById('btn-edit-setoran');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                // Ubah setoran dan sesuaikan saldo (selisih nilai) dalam satu proses
                const diff = x.status === 'Selesai' ? r.total - (x.totalValue || 0) : 0;
                const batch = db.batch();
                batch.update(db.collection('setoran').doc(id), {
                    category: r.cat, actWeight: r.w, date, totalValue: r.total, pricePerKg: r.unit
                });
                if (diff !== 0 && dbUsers.some(u => u.id === x.userId)) {
                    batch.update(db.collection('users').doc(x.userId), {
                        saldo: firebase.firestore.FieldValue.increment(diff)
                    });
                }
                await batch.commit();
                closeModal();
                showToast(diff === 0 ? 'Setoran diperbarui.' : 'Setoran diperbarui. Saldo ' + (x.userName || 'nasabah') + ' ' + (diff > 0 ? 'bertambah' : 'berkurang') + ' Rp ' + Math.abs(diff).toLocaleString('id-ID'));
            } catch (err) {
                console.error(err);
                showToast('Gagal menyimpan perubahan: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Simpan Perubahan';
            }
        }

        function openHapusSetoranModal(id) {
            const x = dbSetoran.find(r => r.id === id);
            if (!x) { showToast('Data setoran tidak ditemukan!', 'error'); return; }

                        ${row('Kategori', esc(x.category || '-'))}
                        ${row('Berat', berat(x.actWeight))}
                        ${row('Nilai', 'Rp ' + (x.totalValue || 0).toLocaleString('id-ID'))}
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm">Batal</button>
                        <button type="button" id="btn-hapus-setoran" onclick="handleHapusSetoran('${x.id}')" class="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm">Ya, Hapus</button>
                    </div>
                </div>
            `);
        }

        async function handleHapusSetoran(id) {
            const x = dbSetoran.find(r => r.id === id);
            if (!x) { closeModal(); return; }
            const owner = dbUsers.find(u => u.id === x.userId);
            if (x.status === 'Selesai' && owner && (owner.saldo || 0) - (x.totalValue || 0) < 0) {
                showToast('Saldo nasabah (' + rpf(owner.saldo) + ') tidak cukup untuk membatalkan setoran ini. Cek dulu catatan penarikannya.', 'error');
                return;
            }
            const btn = document.getElementById('btn-hapus-setoran');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }

            try {
                // Hapus setoran dan kurangi saldo dalam satu proses, supaya tidak ada yang setengah jalan
                const batch = db.batch();
                batch.delete(db.collection('setoran').doc(id));
                if (x.status === 'Selesai' && x.totalValue && dbUsers.some(u => u.id === x.userId)) {
                    batch.update(db.collection('users').doc(x.userId), {
                        saldo: firebase.firestore.FieldValue.increment(-x.totalValue)
                    });
                }
                await batch.commit();
                closeModal();
                showToast('Setoran dihapus. Saldo ' + (x.userName || 'nasabah') + ' dikurangi Rp ' + (x.totalValue || 0).toLocaleString('id-ID'));
            } catch (err) {
                console.error(err);
                showToast('Gagal menghapus setoran: ' + err.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'Ya, Hapus'; }
            }
        }

        function laporanData() {
            const inR = d => (d || '') >= laporanFrom && (d || '') <= laporanTo;
            const set = dbSetoran.filter(s => s.status === 'Selesai' && inR(s.date));
            const pen = dbPenarikan.filter(p => inR(p.date));
            const perKat = {}, perNas = {};
            set.forEach(s => {
                const k = perKat[s.category] = perKat[s.category] || { kg: 0, rp: 0 }; k.kg += s.actWeight || 0; k.rp += s.totalValue || 0;
                const n = perNas[s.userName || '-'] = perNas[s.userName || '-'] || { kg: 0, rp: 0, n: 0 }; n.kg += s.actWeight || 0; n.rp += s.totalValue || 0; n.n++;
            });
            return { set, pen, perKat, perNas, totKg: set.reduce((a, s) => a + (s.actWeight || 0), 0), totRp: set.reduce((a, s) => a + (s.totalValue || 0), 0), totPen: pen.reduce((a, p) => a + (p.amount || 0), 0) };
        }
        function renderAdminLaporan() {
            const d = laporanData();

                <tbody class="divide-y divide-slate-100">${Object.keys(d.perKat).length === 0 ? '<tr><td colspan="3" class="p-6 text-center text-slate-400">Tidak ada setoran pada periode ini.</td></tr>' : Object.keys(d.perKat).sort().map(k => `<tr><td class="p-3 font-bold text-slate-800">${esc(k)}</td><td class="p-3">${kg(d.perKat[k].kg)} kg</td><td class="p-3 font-bold text-emerald-700">${rpf(d.perKat[k].rp)}</td></tr>`).join('')}</tbody></table></div></div>`;
        }
        function unduhLaporan() {
            const d = laporanData(); const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const row = a => a.map(q).join(';');
            const L = ['sep=;', row(['LAPORAN BANK SAMPAH TERATAI']), row(['Periode', laporanFrom + ' s/d ' + laporanTo]), '',
                row(['REKAP PER KATEGORI']), row(['Kategori', 'Berat (kg)', 'Nilai (Rp)']), ...Object.keys(d.perKat).sort().map(k => row([k, d.perKat[k].kg, d.perKat[k].rp])), row(['TOTAL', d.totKg, d.totRp]), '',
                row(['REKAP PER NASABAH']), row(['Nasabah', 'Jumlah setoran', 'Berat (kg)', 'Nilai (Rp)']), ...Object.keys(d.perNas).sort().map(k => row([k, d.perNas[k].n, d.perNas[k].kg, d.perNas[k].rp])), '',
                row(['DAFTAR SETORAN']), row(['Tanggal', 'Nasabah', 'Kategori', 'Berat (kg)', 'Nilai (Rp)']), ...d.set.sort((a, b) => a.date.localeCompare(b.date)).map(s => row([s.date, s.userName, s.category, s.actWeight, s.totalValue])), '',

            const url = URL.createObjectURL(new Blob(['\ufeff' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
            const a = document.createElement('a'); a.href = url; a.download = 'laporan-bank-sampah-' + laporanFrom + '_' + laporanTo + '.csv';
            document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('Laporan periode ' + laporanFrom + ' s/d ' + laporanTo + ' diunduh.');
        }

        async function handleSavePenarikan(event, id) {
            event.preventDefault();
            const editing = id ? dbPenarikan.find(x => x.id === id) : null;
            if (id && !editing) { closeModal(); return; }
            const userId = editing ? editing.userId : document.getElementById('pen-user').value;
            const date = document.getElementById('pen-date').value || todayStr();
            const amount = parseRupiah(document.getElementById('pen-amount').value);
            const note = document.getElementById('pen-note').value.trim();

            if (!userId) { showToast('Pilih nasabah dulu!', 'error'); return; }
            if (amount <= 0) { showToast('Jumlah harus lebih dari 0!', 'error'); return; }
            const owner = dbUsers.find(u => u.id === userId);
            if (!owner) { showToast('Nasabah tidak ditemukan!', 'error'); return; }
            if (amount > penarikanAvailable(userId, editing)) {
                showToast('Jumlah melebihi saldo nasabah (' + rpf(penarikanAvailable(userId, editing)) + ')!', 'error');
                return;
            }

            const btn = document.getElementById('btn-pen-save');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                // Catatan dan saldo diperbarui sekaligus
                const batch = db.batch();
                const userRef = db.collection('users').doc(userId);
                if (editing) {
                    const diff = amount - (editing.amount || 0);
                    batch.update(db.collection('penarikan').doc(id), { date, amount, note });
                    if (diff !== 0) batch.update(userRef, { saldo: firebase.firestore.FieldValue.increment(-diff) });
                } else {
                    batch.set(db.collection('penarikan').doc(), { userId, date, amount, note, createdAt: Date.now() });
                    batch.update(userRef, { saldo: firebase.firestore.FieldValue.increment(-amount) });
                }
                await batch.commit();
                closeModal();
                showToast(editing ? 'Catatan penarikan diperbarui.' : 'Penarikan ' + rpf(amount) + ' dicatat. Saldo ' + owner.name + ' dikurangi.');
            } catch (err) {
                console.error(err);
                showToast('Gagal menyimpan: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = editing ? 'Simpan' : 'Catat';
            }
        }

        // Foto dikecilkan dulu (maks. 900px, JPEG) supaya muat disimpan di Firestore tanpa layanan tambahan
        function compressImage(file, maxSide = 900, quality = 0.78, maxChars = 700000) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    try {
                        let side = maxSide, q = quality;
                        for (let i = 0; i < 6; i++) {
                            const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
                            const w = Math.max(1, Math.round(img.naturalWidth * scale));
                            const h = Math.max(1, Math.round(img.naturalHeight * scale));
                            const c = document.createElement('canvas');
                            c.width = w; c.height = h;
                            const ctx = c.getContext('2d');
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, w, h);
                            ctx.drawImage(img, 0, 0, w, h);
                            const out = c.toDataURL('image/jpeg', q);
                            if (out.length <= maxChars) return resolve(out);
                            q = Math.max(0.5, q - 0.1);
                            side = Math.round(side * 0.85);
                        }
                        reject(new Error('Foto terlalu besar'));
                    } catch (e) { reject(e); }
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Format foto tidak didukung')); };
                img.src = url;
            });
        }

        async function handleKaryaFile(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showToast('File harus berupa gambar!', 'error'); input.value = ''; return; }
            if (file.size > MAX_FOTO_KARYA) {
                showToast('Ukuran foto ' + (file.size / 1048576).toFixed(1).replace('.', ',') + ' MB, maksimal 1 MB!', 'error');
                input.value = '';
                return;
            }
            const prev = document.getElementById('karya-preview');
            const saveBtn = document.getElementById('btn-karya-save');
            karyaBusy = true;
            if (saveBtn) saveBtn.disabled = true;
            if (prev) prev.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400 text-xl"></i>';
            try {
                karyaDraftImage = await compressImage(file);
            } catch (err) {
                console.error(err);
                showToast('Foto tidak bisa diproses. Coba foto lain.', 'error');
            } finally {
                karyaBusy = false;
                const prev2 = document.getElementById('karya-preview');
                if (prev2) prev2.innerHTML = karyaPreviewHtml();
                const btn2 = document.getElementById('btn-karya-save');
